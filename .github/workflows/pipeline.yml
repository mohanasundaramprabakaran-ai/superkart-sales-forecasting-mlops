name: SuperKart Sales Forecasting Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sales_forecasting_mlops/requirements.txt

      - name: Register Dataset
        run: python sales_forecasting_mlops/src/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: sales_forecasting_mlops/data/SuperKart.csv
          if-no-files-found: error

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sales_forecasting_mlops/requirements.txt

      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: sales_forecasting_mlops/data

      - name: Run Data Preparation
        run: python sales_forecasting_mlops/src/prep.py

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            sales_forecasting_mlops/artifacts/Xtrain.csv
            sales_forecasting_mlops/artifacts/Xtest.csv
            sales_forecasting_mlops/artifacts/ytrain.csv
            sales_forecasting_mlops/artifacts/ytest.csv
          if-no-files-found: error

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sales_forecasting_mlops/requirements.txt

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: sales_forecasting_mlops/artifacts

      - name: Train and Evaluate Model
        run: python sales_forecasting_mlops/src/train.py

      - name: Verify Model
        run: test -f sales_forecasting_mlops/artifacts/best_model.joblib

      - name: Copy Model to Deployment Folder
        run: |
          cp sales_forecasting_mlops/artifacts/best_model.joblib \
             sales_forecasting_mlops/deployment/best_model.joblib

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            sales_forecasting_mlops/artifacts/best_model.joblib
            sales_forecasting_mlops/deployment/best_model.joblib
          if-no-files-found: error

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sales_forecasting_mlops/deployment/best_model.joblib
          if ! git diff --cached --quiet; then
            git commit -m "Update SuperKart sales forecasting model [skip ci]"
            git push origin HEAD:main
          else
            echo "Model unchanged; no commit required."
          fi
